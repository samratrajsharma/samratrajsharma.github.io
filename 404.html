<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
<title>Page not found — Samrat Raj Sharma</title>

<!-- Same pre-paint theme read as the main page, so arriving here from a dark
     session doesn't flash white first. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23111111'/%3E%3Ctext x='50' y='70' font-family='Helvetica,Arial,sans-serif' font-size='62' font-weight='700' text-anchor='middle' fill='%23ffffff'%3ES%3C/text%3E%3C/svg%3E" />

<link rel="stylesheet" href="/style.css" />

<style>
  .nf {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .nf-code {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-faint);
    margin-bottom: 22px;
  }
  .nf-title {
    font-size: clamp(34px, 7vw, 62px);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin-bottom: 20px;
  }
  .nf-body {
    font-size: clamp(16px, 2vw, 18px);
    line-height: 1.7;
    color: var(--fg-muted);
    max-width: 52ch;
    margin-bottom: 38px;
  }
  .nf-links {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .nf-links a {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
    border: 1px solid var(--line-strong);
    border-radius: 100px;
    padding: 9px 16px;
    background: var(--bg-subtle);
    transition: color 0.16s ease, background 0.16s ease, border-color 0.16s ease;
  }
  .nf-links a:hover,
  .nf-links a:focus-visible {
    color: var(--bg);
    background: var(--fg);
    border-color: var(--fg);
  }
</style>
</head>
<body>

<main class="nf">
  <div class="container">
    <p class="nf-code">Error 404</p>
    <h1 class="nf-title">This page doesn't exist.</h1>
    <p class="nf-body">
      The link may be out of date, or the address slightly off. Everything on
      this site lives on a single page — the sections below will get you there.
    </p>
    <ul class="nf-links">
      <li><a href="/">Home</a></li>
      <li><a href="/#work">Work</a></li>
      <li><a href="/#publications">Publications</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </div>
</main>

</body>
</html>
